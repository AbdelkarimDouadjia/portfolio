<svg width="360" height="120" viewBox="0 0 360 120" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="_ak. logo">
  <title>_ak. logo</title>
  <rect width="360" height="120" fill="transparent"/>

  <defs>
    <!-- dot-matrix style -->
    <pattern id="dotGrid" width="4" height="4" patternUnits="userSpaceOnUse">
      <circle cx="1.7" cy="1.7" r="0.85" fill="white"/>
    </pattern>

    <!-- subtle glitch cuts -->
    <filter id="glitch" x="-10%" y="-10%" width="120%" height="120%">
      <feOffset in="SourceGraphic" dx="1.6" dy="0" result="off1"/>
      <feOffset in="SourceGraphic" dx="-1.2" dy="0" result="off2"/>
      <feBlend in="off1" in2="off2" mode="screen" result="blend"/>
      <feBlend in="SourceGraphic" in2="blend" mode="screen"/>
    </filter>

    <mask id="dotMask">
      <rect width="360" height="120" fill="black"/>
      <!-- underscore -->
      <rect x="28" y="84" width="58" height="8" fill="white"/>

      <!-- a : rounded-ish terminal shape -->
      <path d="M108 76
               C108 58 122 48 144 48
               C166 48 179 59 179 77
               L179 92
               L157 92
               L157 83
               C151 91 140 96 127 96
               C115 96 105 89 105 78
               C105 66 116 60 133 60
               L157 60
               C154 52 148 48 138 48
               C128 48 120 52 116 59
               L110 59
               C104 64 101 69 101 76 Z
               M132 75
               C132 80 136 83 143 83
               C151 83 157 79 157 72
               L139 72
               C134 72 132 73 132 75 Z" fill="white"/>

      <!-- k : tall stem + sharp diagonal cuts -->
      <path d="M196 24 L222 24 L222 65 L254 48 L284 48 L247 70 L288 94 L256 94 L222 73 L222 94 L196 94 Z" fill="white"/>

      <!-- dot -->
      <rect x="306" y="84" width="12" height="10" fill="white"/>

      <!-- glitch strokes added to mask -->
      <rect x="92" y="55" width="35" height="4" fill="white"/>
      <rect x="177" y="42" width="24" height="4" fill="white"/>
      <rect x="250" y="56" width="26" height="4" fill="white"/>
      <rect x="292" y="91" width="18" height="3" fill="white"/>

      <!-- glitch cuts -->
      <rect x="100" y="68" width="42" height="6" fill="black"/>
      <rect x="166" y="80" width="22" height="5" fill="black"/>
      <rect x="220" y="34" width="34" height="6" fill="black"/>
      <rect x="252" y="76" width="30" height="5" fill="black"/>
    </mask>
  </defs>

  <!-- faint background grid optional; remove this rect for logo only -->
  <g opacity="0.10">
    <pattern id="bg" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect x="1" y="1" width="4" height="4" fill="white"/>
    </pattern>
    <rect width="360" height="120" fill="url(#bg)"/>
  </g>

  <g mask="url(#dotMask)" filter="url(#glitch)">
    <rect x="0" y="0" width="360" height="120" fill="url(#dotGrid)"/>
  </g>
</svg>